name: Cleanup workflow runs

# Manually-triggered cleanup. Deletes every workflow run in this repo
# except the run executing this cleanup. Useful for clearing accumulated
# CI/Pages history. Re-runs are safe — already-deleted runs are skipped.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all previous runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          total=0
          # `gh run list` returns at most 1000 entries; loop until empty.
          while : ; do
            ids=$(gh run list --repo "$REPO" --limit 1000 --json databaseId \
              --jq ".[] | select(.databaseId | tostring != \"$SELF_RUN_ID\") | .databaseId")
            [ -z "$ids" ] && break
            for id in $ids; do
              if gh run delete --repo "$REPO" "$id" 2>/dev/null; then
                total=$((total + 1))
              else
                echo "skip $id (could not delete)"
              fi
            done
          done
          echo "Deleted $total run(s)"
