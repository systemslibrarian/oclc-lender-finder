name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node (for /preview/ React build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build /preview/ React app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css sw.js manifest.webmanifest \
             lenders-directory.json lvis-policies.json film-policies.json flin-policies.json lyra-policies.json pla-policies.json tests.html _site/
          # Optional: include the CSV template if present
          [ -f directory-template.csv ] && cp directory-template.csv _site/ || true
          # The shadcn rebuild lives at /preview/ until it reaches feature
          # parity. The vanilla app at the root stays authoritative.
          mkdir -p _site/preview
          cp -r web/dist/* _site/preview/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
